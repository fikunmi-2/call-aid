[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "call-aid-agent"
version = "0.1.0"
description = "Call AId research-only browser voice demonstration"
requires-python = ">=3.12,<3.15"
dependencies = ["livekit-agents~=1.8", "python-dotenv", "pydantic-settings", "httpx"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
constraint-dependencies = ["yarl<1.24"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
